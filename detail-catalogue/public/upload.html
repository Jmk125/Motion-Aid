<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Project – Detail Catalogue</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .step-content { display: none; }
    .step-content.active { display: block; }
  </style>
</head>
<body>
  <header class="header">
    <h1>Detail <span>Catalogue</span></h1>
    <a href="/" class="btn btn-secondary btn-sm">← Back to search</a>
  </header>

  <div class="container" style="max-width: 720px;">
    <h2 style="font-size:20px; margin-bottom:20px;">New Project</h2>

    <!-- Steps indicator -->
    <div class="steps" id="steps">
      <div class="step active" data-step="1">1. Name</div>
      <div class="step" data-step="2">2. Upload PDFs</div>
      <div class="step" data-step="3">3. Scan Sheets</div>
    </div>

    <!-- Step 1: Project name -->
    <div id="step1" class="step-content active card">
      <h3 style="margin-bottom:16px;">Project Name</h3>
      <div style="display:flex; gap:10px;">
        <input type="text" id="projectName" placeholder="e.g. 456 Main Street – SD Package" style="flex:1;">
        <button class="btn btn-primary" onclick="createProject()">Next →</button>
      </div>
      <div id="step1Error" class="alert alert-error" style="display:none; margin-top:12px;"></div>
    </div>

    <!-- Step 2: File upload -->
    <div id="step2" class="step-content card">
      <h3 style="margin-bottom:16px;">Upload Drawing PDFs</h3>
      <label class="drop-zone" id="dropZone">
        <div class="icon">📁</div>
        <p><strong>Click to select PDFs</strong> or drag and drop here</p>
        <p style="margin-top:4px; font-size:12px;">Multiple files supported · PDF only · Max 500 MB each</p>
        <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple>
      </label>

      <ul class="file-list" id="fileList"></ul>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
        <span id="uploadStatus" style="font-size:13px; color:var(--muted);"></span>
        <button class="btn btn-primary" id="uploadBtn" onclick="uploadFiles()" disabled>Upload & Scan →</button>
      </div>
      <div id="uploadError" class="alert alert-error" style="display:none; margin-top:12px;"></div>
    </div>

    <!-- Step 3: Scan progress -->
    <div id="step3" class="step-content card">
      <h3 style="margin-bottom:16px;">Scanning Sheets…</h3>
      <div id="scanProgress">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
          <div class="spinner"></div>
          <span id="scanMessage" style="font-size:14px;">Starting…</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" id="scanBar" style="width:0%"></div>
        </div>
        <div id="scanDetail" style="font-size:12px; color:var(--muted); margin-top:4px;"></div>
      </div>
      <div id="scanDone" style="display:none;">
        <div class="alert alert-success">✅ Scan complete! Review the detected sheets and confirm which to process.</div>
        <a id="reviewLink" href="#" class="btn btn-primary" style="margin-top:8px;">Review Sheets →</a>
      </div>
      <div id="scanError" class="alert alert-error" style="display:none; margin-top:12px;"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let projectId = null;
    let selectedFiles = [];

    // ── Step nav ──────────────────────────────────────────────
    function goStep(n) {
      document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.step').forEach(el => {
        const s = parseInt(el.dataset.step);
        el.classList.toggle('active', s === n);
        el.classList.toggle('done', s < n);
      });
      document.getElementById(`step${n}`).classList.add('active');
    }

    // ── Step 1: Create project ────────────────────────────────
    async function createProject() {
      const name = document.getElementById('projectName').value.trim();
      const errEl = document.getElementById('step1Error');
      errEl.style.display = 'none';
      if (!name) { errEl.textContent = 'Please enter a project name.'; errEl.style.display = 'block'; return; }

      try {
        const res = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to create project');
        projectId = data.id;
        goStep(2);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    }

    // ── Step 2: File selection ────────────────────────────────
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      addFiles(Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf')));
    });
    fileInput.addEventListener('change', () => {
      addFiles(Array.from(fileInput.files));
      fileInput.value = '';
    });

    function addFiles(files) {
      for (const f of files) {
        if (!selectedFiles.find(sf => sf.name === f.name && sf.size === f.size)) {
          selectedFiles.push(f);
        }
      }
      renderFileList();
    }

    function renderFileList() {
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      for (let i = 0; i < selectedFiles.length; i++) {
        const f = selectedFiles[i];
        const li = document.createElement('li');
        li.className = 'file-item';
        li.dataset.index = i;
        li.innerHTML = `
          <span class="name" title="${esc(f.name)}">📄 ${esc(f.name)}</span>
          <span class="size">${formatSize(f.size)}</span>
          <div class="progress-wrap file-progress" style="display:none"><div class="progress-bar" style="width:0%"></div></div>
          <button class="btn btn-secondary btn-sm" onclick="removeFile(${i})">✕</button>
        `;
        list.appendChild(li);
      }
      document.getElementById('uploadBtn').disabled = selectedFiles.length === 0;
      document.getElementById('uploadStatus').textContent = selectedFiles.length
        ? `${selectedFiles.length} file${selectedFiles.length > 1 ? 's' : ''} selected`
        : '';
    }

    function removeFile(i) {
      selectedFiles.splice(i, 1);
      renderFileList();
    }

    // ── Step 2: Upload files ──────────────────────────────────
    async function uploadFiles() {
      if (!selectedFiles.length) return;
      const btn = document.getElementById('uploadBtn');
      const errEl = document.getElementById('uploadError');
      errEl.style.display = 'none';
      btn.disabled = true;

      const items = document.querySelectorAll('.file-item');

      try {
        // Upload each file individually for per-file progress
        for (let i = 0; i < selectedFiles.length; i++) {
          const file = selectedFiles[i];
          const item = items[i];
          const progressWrap = item.querySelector('.progress-wrap');
          const progressBar = item.querySelector('.progress-bar');
          progressWrap.style.display = 'block';

          const formData = new FormData();
          formData.append('files', file);
          formData.append('projectId', projectId);

          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload');
            xhr.upload.onprogress = e => {
              if (e.lengthComputable) {
                progressBar.style.width = Math.round(e.loaded / e.total * 100) + '%';
              }
            };
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                progressBar.style.width = '100%';
                progressBar.style.background = 'var(--success)';
                resolve(JSON.parse(xhr.responseText));
              } else {
                const err = (() => { try { return JSON.parse(xhr.responseText).error; } catch(e) { return 'Upload failed'; }})();
                reject(new Error(err));
              }
            };
            xhr.onerror = () => reject(new Error('Network error'));
            xhr.send(formData);
          });
        }

        // Trigger scan
        goStep(3);
        await triggerScan();

      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        btn.disabled = false;
      }
    }

    // ── Step 3: Scan ──────────────────────────────────────────
    async function triggerScan() {
      const errEl = document.getElementById('scanError');
      errEl.style.display = 'none';

      try {
        const res = await fetch(`/api/process/scan/${projectId}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Scan failed');
        const jobId = data.jobId;
        await streamJob(jobId, 'scan');
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    }

    function streamJob(jobId, type) {
      return new Promise((resolve, reject) => {
        const es = new EventSource(`/api/jobs/${jobId}/stream`);
        es.onmessage = (e) => {
          const data = JSON.parse(e.data);
          const pct = data.total > 0 ? Math.round(data.progress / data.total * 100) : 0;

          document.getElementById('scanMessage').textContent = data.message || '';
          document.getElementById('scanBar').style.width = pct + '%';
          document.getElementById('scanDetail').textContent = data.total > 0
            ? `${data.progress} / ${data.total}`
            : '';

          if (data.status === 'done') {
            es.close();
            document.getElementById('scanProgress').style.display = 'none';
            document.getElementById('scanDone').style.display = 'block';
            document.getElementById('reviewLink').href = `/review.html?projectId=${projectId}`;
            resolve();
          } else if (data.status === 'error') {
            es.close();
            document.getElementById('scanError').textContent = data.message || 'Scan error';
            document.getElementById('scanError').style.display = 'block';
            reject(new Error(data.message));
          }
        };
        es.onerror = () => {
          es.close();
          document.getElementById('scanError').textContent = 'Connection to server lost.';
          document.getElementById('scanError').style.display = 'block';
          reject(new Error('SSE error'));
        };
      });
    }

    // Enter key support
    document.getElementById('projectName').addEventListener('keydown', e => {
      if (e.key === 'Enter') createProject();
    });
  </script>
</body>
</html>
