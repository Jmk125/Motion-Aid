<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Detail <span>Catalogue</span></h1>
    <a href="/upload.html" class="btn btn-primary btn-sm">+ New Project</a>
  </header>

  <div class="container">
    <!-- Search & filters -->
    <div class="card" style="padding:16px;">
      <div class="search-bar">
        <input type="search" id="searchInput" placeholder="Search details… (e.g. ledger, parapet, footing)" autocomplete="off">
        <select id="disciplineFilter">
          <option value="all">All disciplines</option>
          <option>Architectural</option>
          <option>Structural</option>
          <option>Civil</option>
          <option>Mechanical</option>
          <option>Electrical</option>
          <option>Plumbing</option>
          <option>General</option>
        </select>
        <select id="projectFilter">
          <option value="all">All projects</option>
        </select>
        <button class="btn btn-primary" onclick="search()">Search</button>
      </div>
    </div>

    <!-- Results count -->
    <div id="resultsMeta" style="font-size:13px; color:var(--muted); margin-bottom:8px;"></div>

    <!-- Empty / loading state -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="big-icon">🔍</div>
      <p id="emptyMessage">No details found.</p>
      <a href="/upload.html" class="btn btn-primary" style="margin-top:16px;">Upload your first project</a>
    </div>

    <div id="initialState" class="empty-state">
      <div class="big-icon">🏗️</div>
      <p>Search for construction details above, or <a href="/upload.html">upload a new project</a>.</p>
    </div>

    <div id="loadingState" style="display:none; text-align:center; padding:40px 0;">
      <span class="spinner" style="width:24px; height:24px; border-width:3px;"></span>
    </div>

    <!-- Results grid -->
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <!-- Detail modal -->
  <div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:12px; max-width:700px; width:100%; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);">
        <h3 id="modalTitle" style="font-size:16px;"></h3>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕ Close</button>
      </div>
      <div style="padding:20px;">
        <img id="modalImg" src="" alt="" style="width:100%; border-radius:8px; margin-bottom:16px; border:1px solid var(--border);">
        <div id="modalMeta"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let debounceTimer = null;
    let lastQuery = {};

    // Load project filter options
    async function loadMeta() {
      try {
        const res = await fetch('/api/search/meta');
        const data = await res.json();
        const sel = document.getElementById('projectFilter');
        for (const p of (data.projects || [])) {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          sel.appendChild(opt);
        }
      } catch (e) {}
    }

    async function search() {
      const q = document.getElementById('searchInput').value.trim();
      const discipline = document.getElementById('disciplineFilter').value;
      const project_id = document.getElementById('projectFilter').value;

      const params = new URLSearchParams({ q, discipline, project_id });

      document.getElementById('initialState').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('resultsGrid').innerHTML = '';
      document.getElementById('loadingState').style.display = 'block';
      document.getElementById('resultsMeta').textContent = '';

      try {
        const res = await fetch(`/api/search?${params}`);
        const data = await res.json();

        document.getElementById('loadingState').style.display = 'none';

        if (!data.length) {
          document.getElementById('emptyState').style.display = 'block';
          document.getElementById('emptyMessage').textContent =
            q ? `No details matching "${q}".` : 'No details found yet. Upload a project to get started.';
          return;
        }

        document.getElementById('resultsMeta').textContent = `${data.length} result${data.length !== 1 ? 's' : ''}`;
        renderResults(data);
      } catch (e) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('resultsMeta').textContent = 'Search failed: ' + e.message;
      }
    }

    function renderResults(items) {
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';
      for (const item of items) {
        const card = document.createElement('div');
        card.className = 'detail-card';
        card.innerHTML = `
          <div class="img-wrap">
            <img src="${item.image_url}" alt="${esc(item.label)}" loading="lazy"
              onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'75\\'><rect width=\\'100\\' height=\\'75\\' fill=\\'%23f3f4f6\\'/><text x=\\'50\\' y=\\'40\\' text-anchor=\\'middle\\' font-size=\\'10\\' fill=\\'%236b7280\\'>No image</text></svg>'">
          </div>
          <div class="card-body">
            <div class="label" title="${esc(item.label)}">${esc(item.label)}</div>
            <div class="meta">${esc(item.project_name)}</div>
            <div class="meta">${item.sheet_number ? esc(item.sheet_number) : ''}${item.sheet_title ? ' · ' + esc(item.sheet_title) : ''}</div>
            <div class="badges">
              <span class="badge badge-${esc(item.discipline || 'General')}">${esc(item.discipline || 'General')}</span>
            </div>
          </div>
        `;
        card.style.cursor = 'pointer';
        card.onclick = () => showModal(item);
        grid.appendChild(card);
      }
    }

    function showModal(item) {
      document.getElementById('modalTitle').textContent = item.label;
      document.getElementById('modalImg').src = item.image_url;
      document.getElementById('modalMeta').innerHTML = `
        <table style="font-size:13px; border-collapse:collapse; width:100%;">
          <tr><td style="color:var(--muted);padding:4px 8px 4px 0;width:120px;">Discipline</td>
              <td><span class="badge badge-${esc(item.discipline || 'General')}">${esc(item.discipline || 'General')}</span></td></tr>
          <tr><td style="color:var(--muted);padding:4px 8px 4px 0;">Project</td><td>${esc(item.project_name)}</td></tr>
          ${item.sheet_number ? `<tr><td style="color:var(--muted);padding:4px 8px 4px 0;">Sheet</td><td><code>${esc(item.sheet_number)}</code></td></tr>` : ''}
          ${item.sheet_title ? `<tr><td style="color:var(--muted);padding:4px 8px 4px 0;">Title</td><td>${esc(item.sheet_title)}</td></tr>` : ''}
          ${item.description ? `<tr><td style="color:var(--muted);padding:4px 8px 4px 0;vertical-align:top;">Description</td><td>${esc(item.description)}</td></tr>` : ''}
        </table>
      `;
      const modal = document.getElementById('modal');
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    // Auto-search on input (debounced)
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(search, 350);
    });
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') { clearTimeout(debounceTimer); search(); }
    });
    document.getElementById('disciplineFilter').addEventListener('change', search);
    document.getElementById('projectFilter').addEventListener('change', search);

    // Init
    loadMeta();
    // Show initial state on first load (no auto-search)
  </script>
</body>
</html>
